tagline: Operating Systems::Computer Networks::Distributed Systems::Security
about:
- The Systems Research Group focuses on designing, building, and evaluating computer systems that are efficient, reliable, and scalable. Our research spans multiple areas including distributed systems, operating systems, computer architecture, and system/application security.
- We tackle fundamental challenges in modern computing systems, from cloud infrastructure and edge computing to emerging hardware architectures and system software. Our work combines theoretical insights with practical system building, resulting in both academic contributions and real-world impact.
