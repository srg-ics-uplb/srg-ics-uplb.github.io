  bio: Mark Jay is a UPLB BS Computer Science graduate (Class of 2019) who built his career in software engineering and cybersecurity. After moving to Japan, he started as a penetration test engineer, later transitioning to security operations, where he developed SOAR solutions with Python and automated workflows using Ansible. In March 2024, he joined Early Reflections as a software engineer, contributing to in-house product development, contract projects, and R&D.
