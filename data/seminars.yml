  bio: Nathan is a 20-year-old Filipino cybersecurity enthusiast based in Abu Dhabi, United Arab Emirates, focusing on secure software development and vulnerability research. He holds industry certifications including Offensive Security Certified Professional (OSCP) and CompTIA Network Security Professional (CNSP). His contributions extend to software security research, including playing a pivotal role in discovering multiple CVEs within the privacy-centric Brave Browser.
