  bio: With a strong background in backend engineering, Thea has successfully led small teams, collaborated with clients, and managed complex migration projects. She recently earned a one-year master’s degree in Applied Cybersecurity from the University of New Brunswick (UNB), Canada. Currently, she is advancing her cybersecurity expertise as a Cybersecurity Developer Intern at the Canadian Institute for Cybersecurity (CIC), with research focusing on password modeling and generative AI.
