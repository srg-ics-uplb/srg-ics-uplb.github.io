intro: Interested in systems research? SRG welcomes BS and MS students who want to do their thesis or special problem in operating systems, networks, distributed systems, cybersecurity, or IoT/robotics. Check the faculty research interests above, then email the faculty member whose work matches yours, or contact the group at <a href="mailto:jchermocilla@up.edu.ph">jchermocilla@up.edu.ph</a>.
