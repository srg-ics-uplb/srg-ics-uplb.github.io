intro: Our research addresses fundamental challenges in modern computing systems, with a focus on scalability, reliability, and performance. We work on both theoretical foundations and practical system implementations.
areas:
- title: Computing Infrastructures
  text: We design and build computing infrastructures and tools to support high performance and high throughput computing for use in various computational science disciplines, in particular Bioinformatics and Computational Chemistry.
- title: Robotics and Instrumentation
  text: We develop tools to support autonomous navigation in drones and surface water vehicles. We also develop sensors and associated software for sensing various environmental parameters.
- title: Cybersecurity
  text: We study systems and networks to determine if they are vulnerable to exploitation. We develop tools for mitigating threats.
- title: Computer Science Education
  text: We develop tools and techniques to further improve teaching operating systems, computer networks and other systems topics.
