<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found | Systems Research Group</title>
    <meta name="robots" content="noindex">
    <link rel="icon" type="image/png" href="/logos/logo-white-background.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Optima', 'Palatino', 'Avenir', 'Helvetica', sans-serif;
            line-height: 1.6;
            color: #333;
            background: linear-gradient(135deg, #8B1538 0%, #2E5233 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 40px 32px;
            max-width: 520px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
        }
        .card img { width: 96px; height: 96px; border-radius: 50%; margin-bottom: 16px; }
        .code {
            font-size: 4rem;
            font-weight: 800;
            line-height: 1;
            background: linear-gradient(135deg, #8B1538, #2E5233);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        h1 { font-size: 1.5rem; color: #8B1538; margin: 8px 0 12px; }
        p { color: #555; margin-bottom: 24px; }
        .links { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; }
        .links a {
            color: #8B1538;
            text-decoration: none;
            font-weight: 600;
            padding: 8px 18px;
            border: 2px solid #8B1538;
            border-radius: 25px;
            transition: background 0.2s ease, color 0.2s ease;
        }
        .links a:hover, .links a:focus-visible { background: #8B1538; color: white; }
    </style>
</head>
<body>
    <main class="card">
        <img src="/logos/logo-white-background.png" alt="SRG logo" width="96" height="96">
        <div class="code">404</div>
        <h1>Page not found</h1>
        <p>The page you're looking for doesn't exist or may have moved.</p>
        <nav class="links" aria-label="Helpful links">
            <a href="/">SRG Home</a>
            <a href="/seminars.html">Seminars</a>
            <a href="/news.html">News</a>
        </nav>
    </main>
</body>
</html>
